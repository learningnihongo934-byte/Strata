<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="icon.svg" alt=""><span>Strata</span></div>
    <nav>
      <a data-view="library" class="active">🎮 Library</a>
      <a data-view="stores">🛒 Stores</a>
      <a data-view="help">❓ Help</a>
    </nav>
    <button class="btn ghost stop-btn" id="stop-all">⏹ Close all games</button>
    <div class="side-foot" id="mac-info"></div>
  </aside>
  <main id="main"><div class="center muted">Loading…</div></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
